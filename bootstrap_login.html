<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 16px; background: #f5f5f5; }
    .form-signin { width: 100%; max-width: 330px; margin: auto; text-align: center; }
    .bootstrap-logo { width: 72px; height: 72px; margin-bottom: 20px; }
    .form-signin .form-control { height: 48px; font-size: 16px; }
    .form-signin input[type="email"] { border-bottom-right-radius: 0; border-bottom-left-radius: 0; margin-bottom: -1px; }
    .form-signin input[type="password"] { border-top-left-radius: 0; border-top-right-radius: 0; }
    .form-signin .form-control:focus { position: relative; z-index: 2; }
    .remember { margin: 12px 0 22px; }
  </style>
</head>
<body>
  <main class="form-signin">
    <form action="#" method="post" onsubmit="event.preventDefault(); alert('Đây là giao diện thực hành, chưa kết nối hệ thống đăng nhập.');">
      <svg class="bootstrap-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Bootstrap logo">
        <rect width="72" height="72" rx="13" fill="#563d7c"/>
        <text x="36" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="56" fill="white">B</text>
      </svg>
      <h1 class="h3 mb-3 fw-normal">Please sign in</h1>
      <label class="visually-hidden" for="inputEmail">Email address</label>
      <input type="email" id="inputEmail" class="form-control" placeholder="Email address" autocomplete="email" required autofocus>
      <label class="visually-hidden" for="inputPassword">Password</label>
      <input type="password" id="inputPassword" class="form-control" placeholder="Password" autocomplete="current-password" required>
      <div class="checkbox remember"><label><input type="checkbox" value="remember-me"> Remember me</label></div>
      <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
      <p class="mt-5 mb-3 text-muted">&copy; 2017–2018</p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
